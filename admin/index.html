<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상담 신청 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--paper:#EDEEE9;--ink:#1A1C20;--ink-2:#4A4E55;--rule:#C9CBC2;--blue:#2F3FD8;--white:#fff;--red:#B3261E}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:24px;letter-spacing:-.03em;margin:0 0 20px}
  button,input{font:inherit}
  .btn{min-height:48px;padding:0 18px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;border-radius:2px;cursor:pointer}
  .btn.line{background:transparent;color:var(--ink)}
  #login form{display:grid;gap:12px;max-width:360px}
  #login input{min-height:48px;padding:0 14px;border:2px solid var(--rule);border-radius:2px;background:var(--white);font-size:17px}
  #login input:focus{outline:none;border-color:var(--blue)}
  .err{color:var(--red);font-weight:600;margin:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:16px}
  .count{font-size:56px;font-weight:850;line-height:1;letter-spacing:-.04em}
  .count small{display:block;font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:6px}
  .tools{display:flex;gap:8px}
  .empty{color:var(--ink-2);padding:32px 0}
  .card{background:var(--white);border:1px solid var(--rule);padding:16px;margin-bottom:12px}
  .card.new{border-left:4px solid var(--blue)}
  .row1{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:14px}
  .name{font-size:19px;font-weight:700;margin:6px 0 2px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--ink-2)}
  .copy{border:0;background:none;padding:0;color:var(--blue);font-weight:700;font-size:17px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .text{white-space:pre-wrap;margin:10px 0 0}
  .status{display:flex;gap:6px;margin-top:14px}
  .status button{flex:1;min-height:44px;border:1px solid var(--ink);background:var(--white);color:var(--ink);border-radius:2px;font-weight:600;cursor:pointer}
  .status button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:2px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <section id="login">
    <h1>상담 신청 관리</h1>
    <form id="loginForm">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">들어가기</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <section id="board" hidden>
    <div class="top">
      <div class="count"><span id="newCount">0</span><small>새 문의</small></div>
      <div class="tools">
        <button class="btn line" id="reload" type="button">새로고침</button>
        <button class="btn line" id="logout" type="button">나가기</button>
      </div>
    </div>
    <p class="err" id="boardErr" role="alert"></p>
    <div id="list"></div>
  </section>
</div>
<div id="toast" hidden role="status"></div>

<script>
  const KEY = 'blogAdminPw';
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (d) => new Date(d).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
  let pw = sessionStorage.getItem(KEY) || '';

  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

  async function api(method, body) {
    const r = await fetch('/api/admin', {
      method, headers: { 'x-admin-password': pw, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { const e = new Error(data.error || '비밀번호가 맞지 않아요.'); e.auth = true; throw e; }
    if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
    return data;
  }

  function showLogin(msg) {
    pw = ''; sessionStorage.removeItem(KEY);
    $('board').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  }

  function render(rows) {
    $('newCount').textContent = rows.filter((r) => r.status === '새 문의').length;
    if (!rows.length) { $('list').innerHTML = '<p class="empty">아직 들어온 상담 신청이 없어요. 사이트에서 신청이 들어오면 여기에 보여요.</p>'; return; }
    $('list').innerHTML = rows.map((r) => `
      <article class="card ${r.status === '새 문의' ? 'new' : ''}">
        <div class="row1"><span>${esc(fmt(r.created_at))}</span><span>${esc(r.business_type || '업종 안 적음')}</span></div>
        <p class="name">${esc(r.name)}</p>
        <div class="meta">
          <button class="copy" type="button" data-copy="${esc(r.contact)}">${esc(r.contact)}</button>
          ${r.blog_url ? `<span>블로그: ${esc(r.blog_url)}</span>` : ''}
        </div>
        ${r.message ? `<p class="text">${esc(r.message)}</p>` : ''}
        <div class="status" role="group" aria-label="처리 상태">
          ${STATUSES.map((s) => `<button type="button" data-id="${r.id}" data-status="${s}" aria-pressed="${r.status === s}">${s}</button>`).join('')}
        </div>
      </article>`).join('');
  }

  async function load() {
    $('boardErr').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true; $('board').hidden = false;
      render(rows);
    } catch (e) {
      if (e.auth) return showLogin('비밀번호가 맞지 않아요.');
      if ($('board').hidden) { $('loginErr').textContent = e.message; } else { $('boardErr').textContent = e.message; }
    }
  }

  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    pw = $('pw').value; sessionStorage.setItem(KEY, pw); load();
  });
  $('reload').addEventListener('click', load);
  $('logout').addEventListener('click', () => showLogin(''));
  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.copy); toast('연락처를 복사했어요'); }
      catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(c); s.removeAllRanges(); s.addRange(rg); toast('선택했어요. 길게 눌러 복사하세요'); }
      return;
    }
    const b = e.target.closest('[data-status]');
    if (!b) return;
    try { await api('PATCH', { id: Number(b.dataset.id), status: b.dataset.status }); toast(`'${b.dataset.status}'(으)로 바꿨어요`); load(); }
    catch (err) { if (err.auth) return showLogin('비밀번호가 맞지 않아요.'); $('boardErr').textContent = err.message; }
  });

  if (pw) load(); else $('pw').focus();
</script>
</body>
</html>
